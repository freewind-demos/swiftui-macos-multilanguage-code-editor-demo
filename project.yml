name: SwiftUIMultilanguageCodeEditorDemo
options:
  bundleIdPrefix: com.freewind
  deploymentTarget:
    macOS: "14.0"
packages:
  CodeEditor:
    url: https://github.com/ZeeZide/CodeEditor.git
    from: 1.2.6
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  SwiftUIMultilanguageCodeEditorDemo:
    type: application
    platform: macOS
    sources:
      - Sources
    dependencies:
      - package: CodeEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freewind.SwiftUIMultilanguageCodeEditorDemo
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
